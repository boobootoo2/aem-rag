<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html">
  <sly data-sly-call="${clientlib.css @ categories='aem-rag.console'}"/>
</sly>

<div class="aem-rag-console">
  <h2>AEM RAG Query Console</h2>
  
  <div class="stats-bar" id="statsBar">
    <div class="stat-item">
      <span class="stat-label">Cache Size</span>
      <span class="stat-value" id="cacheSize">-</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Hit Rate</span>
      <span class="stat-value" id="hitRate">-</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Total Requests</span>
      <span class="stat-value" id="totalRequests">-</span>
    </div>
  </div>

  <div class="query-section">
    <form id="queryForm">
      <textarea id="userInput" rows="4" placeholder="Ask about AEM content... (e.g., 'How do I configure the dispatcher?')"></textarea>
      <div class="button-group">
        <button type="submit" class="btn-primary">🔍 Query</button>
        <button type="button" class="btn-secondary" onclick="loadCacheStats()">📊 Refresh Stats</button>
        <button type="button" class="btn-secondary" onclick="clearCache()">🗑️ Clear Cache</button>
      </div>
    </form>
  </div>

  <div id="response"></div>
</div>

<sly data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html">
  <sly data-sly-call="${clientlib.js @ categories='aem-rag.console'}"/>
</sly>
